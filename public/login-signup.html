<!DOCTYPE html>
<html>
<head>
<title>Family Social Platform</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.hidden { display: none; }
</style>
</head>

<body class="bg-light">

<div class="container mt-5">
<div class="card shadow p-4">

<h3 class="text-center">Family Social Platform</h3>

<!-- Toggle Buttons -->
<div class="text-center mb-3">
<button class="btn btn-primary" onclick="showLogin()">Login</button>
<button class="btn btn-secondary" onclick="showSignup()">Signup</button>
</div>

<!-- LOGIN FORM -->
<form id="loginForm" action="/auth/login" method="POST">
<input name="email" class="form-control mb-2" placeholder="Email">
<input name="password" type="password" class="form-control mb-2" placeholder="Password">
<button class="btn btn-success w-100">Login</button>
</form>

<!-- SIGNUP FORM -->
<form id="signupForm" class="hidden" action="/auth/signup" method="POST">
<input name="name" class="form-control mb-2" placeholder="Name">
<input name="email" class="form-control mb-2" placeholder="Email">
<input name="password" type="password" class="form-control mb-2" placeholder="Password">
<button class="btn btn-primary w-100">Signup</button>
</form>

</div>
</div>

<script>
function showLogin() {
  document.getElementById("loginForm").classList.remove("hidden");
  document.getElementById("signupForm").classList.add("hidden");
}

function showSignup() {
  document.getElementById("signupForm").classList.remove("hidden");
  document.getElementById("loginForm").classList.add("hidden");
}
</script>

</body>
</html>
